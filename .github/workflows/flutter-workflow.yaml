name: Flutter workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04 # or ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable analytics
        run: |
          flutter --disable-analytics
          dart --disable-analytics

      - name: "DEBUG: Flutter state"
        run: flutter doctor -v

      - name: Get dependencies
        run: |
          flutter pub get
          flutter pub outdated

      - name: "Check: Dart formatting"
        run: dart format --output=none --set-exit-if-changed .

      - name: "Check: Flutter Analyze"
        run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings

  test:
    name: Test
    # needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable analytics
        run: |
          flutter --disable-analytics
          dart --disable-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --coverage --coverage-path coverage/lcov.info --file-reporter json:test-results.json

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Flutter Tests
          path: test-results.json
          reporter: flutter-json

      # - name: LCOV Summary
      #   uses: pre-history/lcov-summary-action@lcov-summary-action-v0.6.1
      #   # https://github.com/pre-history/lcov-summary-action
      #   with:
      #     coverage-threshold: 1
      #     # comment-on-pr: true

  build_apk:
    name: Build APK
    needs: [analyze, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable analytics
        run: |
          flutter --disable-analytics
          dart --disable-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Java & Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17" # FIXME: parse Java version from Flutter configuration
          cache: "gradle"

      - name: Generate APK name
        run: |
          GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-7)
          APP_NAME=$(yq e '.name' pubspec.yaml)
          APP_VERSION=$(yq e '.version' pubspec.yaml)
          if [[ $GITHUB_REF =~ ^refs/tags/ ]]; then
            echo "APP_FILENAME=${APP_NAME}-${APP_VERSION}" >> $GITHUB_ENV
          else
            echo "APP_FILENAME=${APP_NAME}-${APP_VERSION}-beta_${GITHUB_SHA_SHORT}" >> $GITHUB_ENV
          fi

      - name: Build APK
        # https://github.com/flutter/flutter/issues/29509#issuecomment-762274977
        run: |
          flutter build apk --no-pub --release --obfuscate --split-debug-info=build/app/outputs/symbols
          mv -v build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/$APP_FILENAME.apk

      - name: Store APK as artifact
        uses: actions/upload-artifact@v7
        # https://github.com/actions/upload-artifact
        with:
          # name: "${{ env.APP_FILENAME }}.apk"
          archive: false
          path: "build/app/outputs/flutter-apk/${{ env.APP_FILENAME }}.apk"
          # retention-days: 30
          if-no-files-found: error

      # - name: Store checksum as artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: "${{ env.APP_FILENAME }}.apk.sha256"
      #     path: "build/app/outputs/flutter-apk/${{ env.APP_FILENAME }}.apk.sha256"
      #     retention-days: 30
      #     if-no-files-found: error

      # - name: Store debug symbols as artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     archive: true
      #     name: "${{ env.APP_FILENAME }}-symbols"
      #     path: "build/app/outputs/symbols"
      #     # retention-days: 30
      #     if-no-files-found: error

      - name: "DEBUG: Flutter state"
        run: flutter doctor -v

      - name: Get apk info
        id: apk-info
        uses: hkusu/apk-info-action@v1
        with:
          apk-path: "build/app/outputs/flutter-apk/${{ env.APP_FILENAME }}.apk"
      - name: "Display APK Info"
        run: |
          echo "| ${{ steps.apk-info.outputs.application-name }} | ${{ steps.apk-info.outputs.application-id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.apk-info.outputs.version-name }} (${{ steps.apk-info.outputs.version-code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| SDK Version | ${{ steps.apk-info.outputs.target-sdk-version }} (min. ${{ steps.apk-info.outputs.min-sdk-version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| File Size | ${{ steps.apk-info.outputs.readable-file-size }} (${{ steps.apk-info.outputs.file-size }} bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Permissions:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.apk-info.outputs.uses-permissions }}' | jq -r '.[]' | while read perm; do echo "- $perm" >> $GITHUB_STEP_SUMMARY; done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Checksum:** \`$(sha256sum build/app/outputs/flutter-apk/${{ env.APP_FILENAME }}.apk | cut -d' ' -f1)\`" >> $GITHUB_STEP_SUMMARY
